name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below
        to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Type '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Orplex is affected?
      multiple: false
      options:
        - Web UI (Chat)
        - Web UI (Agent/Tools)
        - VS Code Extension
        - CLI Tool
        - API (/api/chat, /api/agent)
        - Admin Dashboard
        - Authentication
        - Database/Prisma
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Agent Mode
      description: Which mode were you using when the bug occurred?
      multiple: false
      options:
        - Ask mode
        - Plan mode
        - Code mode
        - N/A
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide your environment details.
      value: |
        - OS: [e.g., Windows 11, macOS 14, Ubuntu 24.04]
        - Node.js version: [e.g., 20.11.0]
        - Browser: [e.g., Chrome 120, Firefox 121] (if web UI)
        - VS Code version: [e.g., 1.90.0] (if extension)
        - Orplex version/commit: [e.g., 1.0.0 or abc1234]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Paste any relevant console logs, error messages, or screenshots.
        This will be automatically formatted as code.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem (screenshots, related issues, etc.)
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this is not a duplicate
          required: true
        - label: I am using the latest version of Orplex
          required: false
