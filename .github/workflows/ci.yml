name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Lint + TypeCheck (fast gate, no DB needed)
  # ──────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npm run typecheck

      - name: API wiring audit
        run: npm run audit

      - name: Env check (.env.example stays the complete spec)
        run: npm run env:check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orplex_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orplex_test
          NEXTAUTH_SECRET: test-secret-ci-only

  # ──────────────────────────────────────────────────────────────────
  # Tests (unit + integration, with coverage)
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          set -o pipefail
          npx jest --coverage --forceExit --detectOpenHandles 2>&1 | tee jest-output.txt
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orplex_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orplex_test
          NEXTAUTH_SECRET: test-secret-ci-only
          NEXTAUTH_URL: http://localhost:5000

      # The failing test names are otherwise invisible outside the runner
      # (step logs need a PAT), which made every red Tests job a guessing
      # game. Publish the tail of the jest output in the job summary and as
      # an artifact so a failure can be read straight from the API.
      - name: Publish test output
        if: always()
        run: |
          {
            echo "### Jest output (tail)"
            echo '```text'
            tail -n 300 jest-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-output
          path: jest-output.txt
          retention-days: 7

      # Step logs need a PAT, so a red Tests job used to be a guessing game:
      # the failing test names were invisible from outside the runner. A
      # commit comment is public for a public repo and readable via the API.
      - name: Comment the jest output on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Jest output (tail)"
            echo '```text'
            tail -n 250 jest-output.txt || true
            echo '```'
          } > summary.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat summary.md)" || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # Build (full Next.js build — needs Prisma + DB)
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orplex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orplex_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orplex_test
      NEXTAUTH_SECRET: test-secret-for-build-only
      NEXTAUTH_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

