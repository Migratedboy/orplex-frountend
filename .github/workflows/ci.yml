name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Lint + TypeCheck (fast gate, no DB needed)
  # ──────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npm run typecheck

      - name: API wiring audit
        run: npm run audit

      - name: Env check (.env.example stays the complete spec)
        run: npm run env:check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orplex_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orplex_test
          NEXTAUTH_SECRET: test-secret-ci-only

  # ──────────────────────────────────────────────────────────────────
  # Tests (unit + integration, with coverage)
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx jest --coverage --forceExit --detectOpenHandles
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orplex_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orplex_test
          NEXTAUTH_SECRET: test-secret-ci-only
          NEXTAUTH_URL: http://localhost:5000

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # Build (full Next.js build — needs Prisma + DB)
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orplex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orplex_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orplex_test
      NEXTAUTH_SECRET: test-secret-for-build-only
      NEXTAUTH_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

