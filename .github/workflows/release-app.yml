# release-app.yml — Desktop installers per OS, published to GitHub Releases.
#
# Flow: push tag v* (e.g. v1.0.1) → matrix builds electron:dist per OS →
# artifacts attach to the tag's Release (draft handling: releases are created
# as DRAFTS first — publish manually after smoke-testing one installer).
# The in-app updater (electron/updater.ts) reads these Releases as its feed.
#
# Rollback: unpublish/hide the Release — installed apps keep working against
# the (backward-compatible) backend; fix forward with the next tag.

name: Release App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # electron-builder caches its helper binaries (fpm, nsis, winCodeSign,
      # app-builder) here; caching them avoids re-hitting the flaky
      # electron-builder-binaries mirror on every release.
      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
            ~\AppData\Local\electron-builder\Cache
            ~/Library/Caches/electron-builder
          key: eb-binaries-${{ matrix.os }}-v1

      - name: Install dependencies
        shell: bash
        env:
          # Electron's postinstall binary download (via got) 504s from the
          # mirror — a pure flake, and electron-builder fetches the runtime
          # itself (with its own cache) at the packaging step anyway.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        # Electron's binary download (via got) can 504 from the mirror;
        # retry up to 3 times instead of failing the whole release.
        run: |
          for i in 1 2 3; do
            if npm ci; then break; fi
            echo "npm ci failed (attempt $i of 3), waiting 15s before retry…"
            sleep 15
            if [ "$i" = "3" ]; then exit 1; fi
          done

      # The tag is the source of truth for the version. Without this, a tag
      # pushed without a matching package.json bump ships installers whose
      # internal version (and latest.yml version) is the OLD one — the feed
      # then advertises a version the app never reports, and installed apps
      # see themselves as up to date.
      - name: Align version with tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # The installer packages .next/standalone + electron-dist/main.js —
      # both are BUILD OUTPUTS, so they must exist before electron-builder
      # runs (a fresh checkout has neither, and packaging fails outright).
      - name: Build app (Next standalone + electron main)
        run: npm run build && npm run electron:build:main
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orplex
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orplex
          NEXTAUTH_SECRET: release-build-only-secret
          NEXT_TELEMETRY_DISABLED: 1

      # Stage the minimal package tree (electron-dist + standalone server,
      # symlinks resolved) so electron-builder copies a small, real-file tree.
      # Packaging the repo root instead fails on Windows: the standalone
      # bundle contains symlinks that cannot be recreated without elevated
      # privileges (EPERM), and the repo's node_modules makes the dependency
      # scan take many minutes.
      - name: Stage desktop package
        run: npm run electron:stage

      # The dmgbuild toolset (mac DMG target) downloads from the
      # electron-builder-binaries mirror, which intermittently 504s from both
      # upstream and npmmirror. electron-builder supports OFFLINE seeding:
      # placing the archive at <ELECTRON_BUILDER_CACHE>/dmg-builder@1.2.5/
      # <filename> is enough — it checksum-verifies locally (no .state file
      # needed). Fetch it with curl's own retry engine + URL fallbacks here.
      - name: Pre-seed dmgbuild toolset (mirror 504 flake)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          case "$(uname -m)" in arm64) A=arm64 ;; *) A=x86_64 ;; esac
          F="dmgbuild-bundle-${A}-75c8a6c.tar.gz"
          case "$A" in
            arm64)   WANT="793404d0c96687e27d5ee40a668d498c92e36a64d6c2906df511031adb33cbeb" ;;
            x86_64)  WANT="1664972f9cc2d6e8fce3b63e42cd30078aff602669c5856939c4519921200433" ;;
          esac
          D="$HOME/Library/Caches/electron-builder/dmg-builder@1.2.5"
          mkdir -p "$D"
          if [ -f "$D/$F" ]; then echo "already seeded"; exit 0; fi
          for u in \
            "https://npmmirror.com/mirrors/electron-builder-binaries/dmg-builder%401.2.5/$F" \
            "https://github.com/electron-userland/electron-builder-binaries/releases/download/dmg-builder%401.2.5/$F"; do
            echo "trying $u"
            if curl -fL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o "$D/$F.tmp" "$u"; then
              break
            fi
            rm -f "$D/$F.tmp"
          done
          if [ ! -f "$D/$F.tmp" ]; then echo "all mirrors failed for $F"; exit 1; fi
          GOT=$(shasum -a 256 "$D/$F.tmp" | cut -d' ' -f1)
          if [ "$GOT" != "$WANT" ]; then echo "checksum mismatch: $GOT"; exit 1; fi
          mv "$D/$F.tmp" "$D/$F"
          echo "seeded $F (sha256 ok)"

      - name: Build + package (${{ matrix.os }})
        shell: bash
        # The electron-builder helper-binary mirror (electron-userland
        # releases via got) intermittently 504s mid-package — retry a few
        # times before failing the release; the cache step above makes
        # retries after a first successful download nearly free.
        run: |
          # npmmirror override only for linux: the default binaries mirror
          # hard-504s on the AppImage runtime, while it serves the mac/win
          # helper binaries fine (npmmirror 504s those instead).
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            export ELECTRON_BUILDER_BINARIES_MIRROR="https://npmmirror.com/mirrors/electron-builder-binaries/"
          fi
          for i in 1 2 3; do
            if npx electron-builder --projectDir .desktop-package --publish never ${{ matrix.args }}; then
              break
            fi
            echo "electron-builder failed (attempt $i of 3), waiting 20s before retry…"
            sleep 20
            if [ "$i" = "3" ]; then exit 1; fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload build output (installers + updater metadata)
        # electron-updater's GitHub feed needs latest.yml/latest-mac.yml/
        # latest-linux.yml (+ blockmaps) in the Release — upload everything.
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: release/*
          retention-days: 30

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          repository: Migratedboy/orplex-releases
          files: installers/*
          # Published straight away: the in-app updater reads published
          # Releases as its feed, and a draft is invisible to it.
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
