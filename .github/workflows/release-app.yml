# release-app.yml — Desktop installers per OS, published to GitHub Releases.
#
# Flow: push tag v* (e.g. v1.0.1) → matrix builds electron:dist per OS →
# artifacts attach to the tag's Release (draft handling: releases are created
# as DRAFTS first — publish manually after smoke-testing one installer).
# The in-app updater (electron/updater.ts) reads these Releases as its feed.
#
# Rollback: unpublish/hide the Release — installed apps keep working against
# the (backward-compatible) backend; fix forward with the next tag.

name: Release App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag is the source of truth for the version. Without this, a tag
      # pushed without a matching package.json bump ships installers whose
      # internal version (and latest.yml version) is the OLD one — the feed
      # then advertises a version the app never reports, and installed apps
      # see themselves as up to date.
      - name: Align version with tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # The installer packages .next/standalone + electron-dist/main.js —
      # both are BUILD OUTPUTS, so they must exist before electron-builder
      # runs (a fresh checkout has neither, and packaging fails outright).
      - name: Build app (Next standalone + electron main)
        run: npm run build && npm run electron:build:main
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orplex
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orplex
          NEXTAUTH_SECRET: release-build-only-secret
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build + package (${{ matrix.os }})
        run: npx electron-builder --publish never ${{ matrix.args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload build output (installers + updater metadata)
        # electron-updater's GitHub feed needs latest.yml/latest-mac.yml/
        # latest-linux.yml (+ blockmaps) in the Release — upload everything.
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: release/*
          retention-days: 30

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          # Published straight away: the in-app updater reads published
          # Releases as its feed, and a draft is invisible to it.
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
