<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link rel="stylesheet" href="./widget.css" />
  </head>
  <body>
    <div id="glow-host" aria-hidden="true"></div>
    <div id="circle" title="FocusLock">
      <img id="logo" alt="FocusLock logo" draggable="false" />
      <div id="cylinder">
        <div id="segments">
          <div class="seg"><div class="seg-val" id="seg-h">00</div><div class="seg-label">HRS</div></div>
          <div class="sep"><span></span><span></span></div>
          <div class="seg"><div class="seg-val" id="seg-m">00</div><div class="seg-label">MIN</div></div>
          <div class="sep"><span></span><span></span></div>
          <div class="seg"><div class="seg-val" id="seg-s">00</div><div class="seg-label">SEC</div></div>
        </div>
        <div id="fill-wrap"><div id="fill"></div></div>
        <div id="tickwrap"><div id="tick"></div></div>
      </div>
    </div>
    <script type="module" src="./widget.js"></script>
  </body>
</html>
