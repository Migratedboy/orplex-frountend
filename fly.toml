# fly.toml — Deploy to Fly.io (free tier)
# Free tier: 3 shared VMs, 256MB RAM each, always-on (no spin-down)

app = "orplex-tech"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[checks]
  [checks.health]
    port = 8080
    type = "http"
    interval = "10s"
    timeout = "5s"
    path = "/api/health"
