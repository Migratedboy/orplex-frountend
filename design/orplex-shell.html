<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orplex Code – Outer Shell</title>
<script>
(function(){var t='system';try{t=localStorage.getItem('orplex-theme')||'system'}catch(e){}
var dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.dataset.pref=t;})();
</script>
<style>
:root{
  --bg:#151516; --side:#212122; --main:#1b1b1c;
  --hover:#2c2c2e; --active:#353537; --line:#2c2c2e;
  --text:#ececee; --muted:#8d8d93; --accent:#f97316; --accent-bg:rgba(249,115,22,.16);
  --seg:#0f0f10; --tab-hover:#1c1c1e; --card:#272728; --input:#2b2b2d; --dash:#3a3a3d; --cell:#333335; --track:#3a3a3d; --fill:#8f8f94; --heat:#a5c997;
  color-scheme:dark;
  --strip-h:44px; --rail-w:52px; --side-w:255px; --left-w:calc(var(--rail-w) + var(--side-w)); --right-w:420px;
}
@media (max-width:1100px){:root{--right-w:300px}}
:root[data-theme="light"]{
  --bg:#e8e8eb; --side:#f6f6f8; --main:#ffffff;
  --hover:#e6e6ea; --active:#dadade; --line:#dcdce0;
  --text:#1c1c1e; --muted:#6a6a72; --accent:#ea6a0a; --accent-bg:rgba(234,106,10,.13);
  --seg:#dcdce0; --tab-hover:#e1e1e5; --card:#eeeef1; --input:#e6e6ea; --dash:#c3c3ca; --cell:#e0e0e4; --track:#d3d3d9; --fill:#6a6a72; --heat:#4f9a3f;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:13.5px/1.35 "Segoe UI",Inter,system-ui,sans-serif;display:flex;flex-direction:column;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
body.collapsed{--left-w:var(--rail-w)}

/* ---------- TOP STRIP (replaces native title bar) ---------- */
.strip{height:var(--strip-h);display:flex;align-items:stretch;-webkit-app-region:drag}
.strip button,.strip .tab{-webkit-app-region:no-drag}
.lead{width:var(--left-w);flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 12px;overflow:hidden;transition:width .18s ease}
.nav{display:flex;gap:2px}
.nav button{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.nav button:hover{background:var(--hover);color:var(--text)}
.lead-r{display:flex;align-items:center;gap:8px}
.bell{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.bell:hover{background:var(--hover);color:var(--text)}
body.collapsed .lead-r{display:none}
.seg{display:flex;background:var(--seg);border-radius:8px;padding:2px;-webkit-app-region:no-drag}
.seg button{padding:3px 14px;border-radius:6px;color:var(--muted);font-size:12.5px}
.seg button.on{background:var(--active);color:var(--text)}
body.collapsed .seg{display:none}

.tabs{display:flex;align-items:stretch;flex:1;min-width:0;overflow:hidden}
.tab{display:flex;align-items:center;gap:7px;flex:0 1 190px;min-width:60px;padding:0 12px;color:var(--muted);border-left:1px solid var(--line);cursor:pointer;white-space:nowrap;position:relative}
.tab svg.b{width:14px;height:14px;opacity:.7}
.tab span{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab:hover{background:var(--tab-hover);color:var(--text)}
.tab.on{background:var(--main);color:var(--text);border-radius:8px 8px 0 0}
.tab.on svg.b{color:var(--accent);opacity:1}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.tab .x{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;opacity:0}
.tab:hover .x,.tab.on .x{opacity:.8}
.tab .x:hover{background:var(--active)}
.tab .x svg{width:11px;height:11px}
.add{flex:none;width:34px;height:28px;align-self:center;display:grid;place-items:center;color:var(--muted);border-radius:6px;margin-left:4px}
.add:hover{background:var(--hover);color:var(--text)}
/* right zone: own tab strip (right-panel tabs) + window controls, sits exactly above the right panel */
.rzone{width:var(--right-w);flex:none;display:flex;align-items:stretch;min-width:0}
.rzone .tabs{flex:1}
.rzone .tab{flex:0 1 150px;min-width:42px}
.rzone .tab.on{flex:0 0 auto;min-width:110px}
.win{display:flex;flex:none}
.win button{width:46px;display:grid;place-items:center;color:var(--muted)}
.win button:hover{background:var(--hover);color:var(--text)}
.win button.close:hover{background:#e5484d;color:#fff}
.win svg{width:14px;height:14px}

/* ---------- BODY ---------- */
.body{flex:1;display:flex;min-height:0}

/* icon rail */
.rail{width:var(--rail-w);flex:none;display:flex;flex-direction:column;align-items:center;padding:6px 0 10px;gap:6px}
.rail button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.rail button:hover{background:var(--hover);color:var(--text)}
.rail button.on{background:var(--active);color:var(--text)}
.rail svg.i{width:19px;height:19px}
.rail .sp{flex:1}
.usage-pop{position:fixed;z-index:200;width:230px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.4);font-size:12.5px;pointer-events:none;opacity:0;transform:translateX(-4px);transition:opacity .12s ease,transform .12s ease;visibility:hidden}
.usage-pop.show{opacity:1;transform:none;visibility:visible}
.usage-pop .top{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600}
.usage-pop .top span:last-child{color:var(--muted);font-weight:400}
.avatar{cursor:pointer;outline:0;-webkit-app-region:no-drag;position:relative;z-index:1}
.avatar:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--active);display:grid;place-items:center;font-size:12px;font-weight:600}

/* sidebar panel */
.side{width:var(--side-w);flex:none;padding:0 8px 8px 0;overflow:hidden;transition:width .18s ease,padding .18s ease}
body.collapsed .side{width:0;padding:0}
.side-in{width:calc(var(--side-w) - 8px);height:100%;background:var(--side);border-radius:14px;display:flex;flex-direction:column;padding:12px 10px 10px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.2px;flex:1;white-space:nowrap}
.brand button{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.brand button:hover{background:var(--hover);color:var(--text)}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:8px;text-align:left;white-space:nowrap}
.row:hover{background:var(--hover)}
.row svg.i{color:var(--muted)}
.row small{font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--active);color:var(--muted);margin-left:-4px}
.row .pill{margin-left:auto;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-weight:600}
.label{padding:16px 9px 6px;color:var(--muted);font-size:12.5px}
.projects{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--active) transparent}
.projects .row.on{background:var(--active);font-weight:500}
.projects .row.on svg.i{color:var(--accent)}
.foot{border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.foot .meta{display:flex;justify-content:space-between;padding:4px 9px 6px;color:var(--muted);font-size:12.5px}

/* middle placeholder */
.main{flex:1;min-width:0;display:flex}
.center{flex:1;min-width:0;padding:0 10px 14px 0;position:relative}
.tools{position:absolute;top:8px;right:22px;display:flex;gap:2px;z-index:2}
.tools button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.tools button:hover{background:var(--hover);color:var(--text)}
.tools button.on{color:var(--text)}
.tools svg.i{width:17px;height:17px}
body.rp-hidden .rpanel,body.rp-hidden #rtabs{display:none}
body.rp-hidden .rzone{width:auto}
body.rp-hidden .center{padding-right:14px}
.rpanel{width:var(--right-w);flex:none;padding:0 14px 14px 0}
.ph{height:100%;background:var(--main);border:1.5px dashed var(--dash);border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--muted)}
.ph h2{font-size:20px;font-weight:600;color:var(--text);letter-spacing:-.2px}
.ph p{margin-top:6px;font-size:13px}


/* ---------- INTEGRATIONS PAGE (rail extensions icon) ---------- */
.integrations{display:none;flex:1;min-width:0;padding:0 14px 8px 0}
body.integrations-open .side,body.integrations-open .main{display:none}
body.integrations-open .integrations{display:block}
.int-in{height:100%;background:var(--main);border-radius:14px;overflow-y:auto;padding:40px 48px 48px;scrollbar-width:thin;scrollbar-color:var(--active) transparent;user-select:text}
.int-wrap{max-width:880px;margin:0 auto}
.int-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.int-head h1{font-size:28px;font-weight:500;letter-spacing:-.3px}
.int-tools{display:flex;align-items:center;gap:8px}
.int-search{display:flex;align-items:center;gap:9px;height:34px;width:300px;max-width:100%;padding:0 12px;background:var(--input);border-radius:10px;color:var(--muted)}
.int-search svg{width:15px;height:15px;flex:none}
.int-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;user-select:text}
.int-search input::placeholder{color:var(--muted)}
.int-note{color:var(--muted);font-size:12.5px;margin:-12px 0 16px;text-align:right}
.int-note:empty{display:none}
.int-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:20px 22px;margin-bottom:12px}
.int-row>svg.i{width:18px;height:18px;color:var(--muted);flex:none}
.int-row .nm{font-weight:600;font-size:15px}
.int-row small{color:var(--muted);font-size:12px;margin-left:10px}
.int-row .sp{flex:1}
.int-row .btn.off{color:var(--muted)}
.int-empty{color:var(--muted);padding:6px 2px 4px}
.int-h{margin:26px 0 10px;color:var(--muted);font-size:13.5px}
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.int-tile{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--card);border-radius:12px;text-align:left;color:var(--text)}
.int-tile:hover{background:var(--hover)}
.int-tile .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.int-tile>svg.i{width:16px;height:16px;color:var(--muted);flex:none}
.int-tile.added{opacity:.6;cursor:default}
.int-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}

/* ---------- SETTINGS PAGE (rail gear) ---------- */
.settings{display:none;flex:1;min-width:0;padding:0 14px 8px 0}
body.settings-open .side,body.settings-open .main{display:none}
body.settings-open .settings{display:block}
.settings-in{height:100%;background:var(--side);border-radius:14px;display:flex;overflow:hidden}
.s-nav{width:var(--side-w);flex:none;border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--active) transparent}
.s-nav h2{font-size:19px;font-weight:600;padding:0 9px 16px;letter-spacing:-.2px}
.s-search{display:flex;align-items:center;gap:9px;height:34px;padding:0 11px;background:var(--input);border-radius:9px;color:var(--muted);margin-bottom:12px}
.s-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;user-select:text}
.s-search input::placeholder{color:var(--muted)}
.s-item{display:block;width:100%;height:34px;text-align:left;padding:0 9px;border-radius:8px;color:var(--text);white-space:nowrap}
.s-item:hover{background:var(--hover)}
.s-item.on{background:var(--active);font-weight:500}
.s-main{flex:1;min-width:0;overflow-y:auto;padding:40px 42px 48px 48px;scrollbar-width:thin;scrollbar-color:var(--active) transparent;user-select:text}
.s-wrap{max-width:940px;margin:0 auto}
.s-title{font-size:28px;font-weight:500;letter-spacing:-.3px;margin-bottom:28px}
.card{background:var(--card);border-radius:14px;padding:22px;margin-bottom:16px}
.card h3{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;margin-bottom:22px}
.card h3 svg{width:15px;height:15px;color:var(--muted)}
.meter .top{display:flex;justify-content:space-between;margin-bottom:12px}
.meter .top span:last-child{color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fill);border-radius:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat small{display:block;color:var(--muted);font-size:13.5px;margin-bottom:6px}
.stat b{font-size:28px;font-weight:500;letter-spacing:-.4px}
.heat{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px;margin-top:26px;overflow:hidden}
.heat i{border-radius:2px;background:var(--cell)}
.heat i.a{background:var(--heat)}
.lines{margin-top:22px}
.ln{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-top:1px solid var(--line);font-size:14px}
.ln span:first-child{font-weight:600;display:flex;align-items:center;gap:7px}
.ln span:first-child svg{width:15px;height:15px;color:var(--muted);font-weight:400}
.ln span:last-child{color:var(--muted)}

.ks{max-width:700px;margin:0}
.ks-sub{color:var(--muted);margin:-8px 0 20px}
.ks-bar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.ks-g{margin:24px 0 4px;color:var(--muted);font-size:13px;font-weight:500}
.ks-row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:40px;border-bottom:1px solid var(--line)}
.ks-r{display:flex;align-items:center;gap:8px;flex:none}
.ks-keys{display:flex;gap:4px;padding:4px;border-radius:8px}
.ks-keys:hover{background:var(--hover)}
.kc{min-width:28px;height:26px;padding:0 8px;border-radius:7px;background:var(--active);display:inline-grid;place-items:center;font-size:12.5px;font-weight:500}
.ks-none{color:var(--muted);font-size:13px;padding:0 6px}
.ks-ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.ks-ic:hover{background:var(--hover);color:var(--text)}
.ks-ic svg{width:14px;height:14px}
.ks-ic.bg{background:var(--active)}
.ks-cap{padding:5px 12px;border-radius:8px;border:1px dashed var(--accent);color:var(--accent);font-size:12.5px;font-weight:500}
.ks-cap small{color:var(--muted);margin-left:8px;font-weight:400}
.ks-err{color:#e5484d;font-size:12.5px;padding:0 0 8px}
.ks-empty{padding:30px 0;text-align:center;color:var(--muted)}
.sk-card{padding:22px 24px 10px}
.sk-search{width:100%;height:38px;border-radius:9px;border:1px solid transparent;background:var(--input);color:var(--text);font:inherit;padding:0 14px;outline:0;user-select:text}
.sk-search:focus{border-color:var(--accent)}
.sk-search::placeholder{color:var(--muted)}
.sk-bar{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.sk-bar .sp{flex:1}
.sk-bar .cnt{color:var(--muted);font-size:13px}
.sk-cat{margin:22px 0 2px 8px;color:var(--muted);font-size:12.5px;font-weight:600}
.sk{display:flex;align-items:flex-start;gap:14px;padding:16px 8px;border-top:1px solid var(--line)}
.sk-cat+.sk{border-top:0}
.sk-ic{width:34px;height:34px;border-radius:9px;background:var(--input);display:grid;place-items:center;flex:none;color:var(--muted);margin-top:2px}
.sk-ic svg{width:17px;height:17px}
.sk-body{flex:1;min-width:0}
.sk-body b{display:block;font-weight:600;font-size:14.5px;margin-bottom:4px}
.sk-body p{color:var(--muted);font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sk-act{display:flex;align-items:center;gap:12px;flex:none;margin-top:2px}
.sk-empty{padding:34px 0 28px;text-align:center;color:var(--muted)}
.s-title{display:flex;align-items:center;gap:10px}
.s-title .help{display:inline-flex;font-size:0}
.acc-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;padding:6px 0}
.acc-row+.acc-row{border-top:1px solid var(--line)}
.acc-row .k{font-weight:600}
.s-sub{color:var(--muted);margin:-14px 0 24px;max-width:680px;line-height:1.5}
.db-row{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 0}
.db-row+.db-row{border-top:1px solid var(--line)}
.db-row b{display:block;font-weight:600;margin-bottom:4px}
.db-row p{color:var(--muted);font-size:13.5px}
.db-row .btn{flex:none}
.acc-row .v{display:flex;align-items:center;gap:10px;min-width:0}
.acc-row .v span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-row input{height:34px;width:260px;max-width:100%;border-radius:8px;border:1px solid var(--accent);background:var(--input);color:var(--text);font:inherit;padding:0 10px;outline:0;user-select:text}
.card.flat h3.solo{margin-bottom:6px}
.card .f-err:empty,.card .note:empty{display:none}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px}
.cta b{display:block;font-weight:600;margin-bottom:6px}
.cta p{color:var(--muted)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:34px}
.set-row .lbl{display:flex;align-items:center;gap:7px;font-weight:500}
.set-row .lbl svg{width:15px;height:15px;color:var(--muted)}
.card h3.solo{margin-bottom:12px}
.sw{position:relative;width:42px;height:26px;border-radius:13px;background:var(--track);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.sel{appearance:none;background:none;border:0;color:var(--text);font:inherit;font-weight:500;cursor:pointer;padding:6px 22px 6px 8px;border-radius:8px;outline:0;background-image:linear-gradient(45deg,transparent 50%,var(--text) 50%),linear-gradient(135deg,var(--text) 50%,transparent 50%);background-position:calc(100% - 11px) 14px,calc(100% - 7px) 14px;background-size:4px 4px;background-repeat:no-repeat}
.sel:hover{background-color:var(--hover)}
.sel option{background:var(--side);color:var(--text)}
.btn.soft{background:var(--active);color:var(--text)}
.btn.danger{background:#d64550;color:#fff}
.acc-del-txt{color:var(--muted)}
.acc-del-actions{display:flex;gap:8px;flex:none}
.btn.soft:hover{filter:brightness(1.12)}
.btn.icon{width:34px;padding:0}
.btn.icon svg{width:17px;height:17px}
.note{color:var(--muted);font-size:12.5px;margin-top:10px;min-height:16px}
.mp{display:grid;grid-template-columns:280px 1fr;background:var(--card);border-radius:14px;overflow:hidden;align-items:stretch}
.mp-item{display:flex;align-items:center;gap:12px;width:100%;padding:16px 18px;text-align:left;color:var(--text)}
.mp-item:hover,.mp-item.on{background:var(--hover)}
.mp-item b{display:block;font-weight:600;font-size:14px}
.mp-ic{width:34px;height:34px;border-radius:9px;background:var(--input);display:grid;place-items:center;flex:none;color:var(--muted)}
.mp-ic svg{width:18px;height:18px}
.mp-st{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-top:2px}
.mp-st::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--muted);flex:none}
.mp-st.ok::before{background:#4caf50}
.mp-chev{margin-left:auto;color:var(--muted)}
.mp-chev svg{width:14px;height:14px}
.mp-pane{padding:22px 24px;border-left:1px solid var(--line);min-width:0}
.mp-head{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px;margin-bottom:6px}
.mp-head .mp-ic{width:32px;height:32px}
.mp-empty{text-align:center;padding:34px 0 26px}
.mp-empty h4{font-size:19px;font-weight:600;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 16px;border-radius:9px;background:var(--accent);color:#1b1206;font-weight:600;font-size:13.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--text)}
.btn.ghost:hover{background:var(--hover);filter:none}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.f-l{display:block;font-weight:600;margin:18px 0 8px;font-size:14px}
.f-in{width:100%;height:40px;border-radius:9px;border:1px solid transparent;background:var(--input);color:var(--text);font:inherit;padding:0 12px;outline:0;user-select:text}
.f-in:focus{border-color:var(--accent)}
.f-in::placeholder{color:var(--muted)}
select.f-in{appearance:none;cursor:pointer;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px;background-repeat:no-repeat}
.f-row{display:flex;align-items:center;gap:14px}
.f-row select{width:200px;flex:none}
.f-row a{color:var(--text);font-size:13px;text-decoration:none;white-space:nowrap}
.f-row a:hover{text-decoration:underline}
.f-desc{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:13px}
.tier{font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:5px;flex:none;line-height:1.5}
.tier.free{background:rgba(76,175,80,.16);color:#4caf50}
.tier.paid{background:var(--input);color:var(--muted)}
.pv-row .tier{margin-left:6px;vertical-align:1px}
.f-key{position:relative}
.f-key .f-in{padding-right:64px}
.f-key button{position:absolute;right:6px;top:5px;height:30px;padding:0 10px;font-weight:600;border-radius:7px}
.f-key button:hover{background:var(--hover)}
.f-adv{margin-top:22px;padding-top:8px;border-top:1px solid var(--line)}
.f-adv summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;align-items:center;gap:8px}
.f-adv summary::-webkit-details-marker{display:none}
.f-adv summary::before{content:"";border:5px solid transparent;border-left:7px solid currentColor;border-right:0;transition:transform .12s}
.f-adv[open] summary::before{transform:rotate(90deg)}
.f-foot{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.f-foot .sp{flex:1}
.f-err{color:#e5484d;font-size:13px;margin-top:12px;min-height:16px}
.pv-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.pv-row:first-of-type{border-top:0}
.pv-row div{min-width:0;flex:1}
.pv-row b{display:block;font-weight:600}
.pv-row small{display:block;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-note{color:var(--muted);margin:10px 0 0;font-size:13.5px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.theme{background:none;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left;color:var(--text)}
.theme:hover{border-color:var(--muted)}
.theme.on{border-color:var(--accent)}
.theme .pv{height:84px;border-radius:8px;margin-bottom:10px;display:flex;overflow:hidden;border:1px solid rgba(128,128,128,.25)}
.pv i{display:block}
.theme b{font-weight:500}
.theme small{display:block;color:var(--muted);margin-top:2px;font-size:12px}
.rail .themebtn{margin-bottom:4px}
@media (max-width:760px){.lead-r{display:none}}
</style>

<script>
const $=s=>document.querySelector(s);
// Tabs = conversations of the selected project
const state={proj:'orplex',data:{
  orplex:{on:0,tabs:['Fix Orplex Code Install','Orplex Backend Migration','Orplex Electron Self-Update','Request For Project Review','Fix Error Request','AI File Tool Not Working']},
  terminal:{on:0,tabs:['New chat']},
  psd10:{on:0,tabs:['New chat']},
  'nova-studio':{on:0,tabs:['New chat']}
}};
// Right-panel tabs (changes / browser / preview) — independent from conversation tabs, kept per project
const rstate={};
function rget(){return rstate[state.proj]||(rstate[state.proj]={on:0,tabs:[{n:'Changes',ic:'branch'},{n:'Preview',ic:'globe'}]});}

// generic tab strip renderer, used by both zones
function drawTabs(box,list,getOn,setOn,icon,onAdd,addLabel){
  box.innerHTML='';
  list.forEach((t,i)=>{
    const name=typeof t==='string'?t:t.n, ic=typeof t==='string'?icon:t.ic;
    const d=document.createElement('div');
    d.className='tab'+(i===getOn()?' on':''); d.title=name;
    d.innerHTML='<svg class="i b"><use href="#'+ic+'"/></svg><span></span><button class="x" aria-label="Close tab"><svg class="i"><use href="#x"/></svg></button>';
    d.querySelector('span').textContent=name;
    d.addEventListener('click',e=>{
      if(e.target.closest('.x')){
        list.splice(i,1);
        let on=getOn();
        if(i<on) on--;
        if(on>=list.length) on=list.length-1;
        setOn(Math.max(on,0));
      } else setOn(i);
      render();
    });
    box.appendChild(d);
  });
  const a=document.createElement('button');
  a.className='add'; a.setAttribute('aria-label',addLabel);
  a.innerHTML='<svg class="i"><use href="#plus"/></svg>';
  a.addEventListener('click',onAdd);
  box.appendChild(a);
}
function render(){
  const p=state.data[state.proj], r=rget();
  if(!p.tabs.length){p.tabs.push('New chat');p.on=0;}
  drawTabs($('#tabs'),p.tabs,()=>p.on,v=>p.on=v,'branch',addChat,'New conversation');
  drawTabs($('#rtabs'),r.tabs,()=>r.on,v=>r.on=v,'globe',addRight,'New panel tab');
}
function addChat(){const p=state.data[state.proj];p.tabs.push('New chat');p.on=p.tabs.length-1;render();}
function addRight(){const r=rget();r.tabs.push({n:'New tab',ic:'globe'});r.on=r.tabs.length-1;render();}
// Code / Chat toggle
$('#seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...$('#seg').children].forEach(x=>x.classList.toggle('on',x===b));
});
// ---------- Rail + Settings page ----------
const SPAGES=['General','Account','Appearance','Usage','Model Providers','Database','Skills','Keyboard shortcuts','Archived'];
const HELP='<svg class="i"><use href="#help"/></svg>';
// ---------- Usage data: ONE source, everything on the page is derived from it ----------
// Real numbers come from the host app (Electron/backend):  window.setOrplexUsage({...})  or preset window.orplexUsage
// SAMPLE below is only used until the host sends real data.
const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const daysAgo=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return d;};
const SAMPLE={
  daily:{used:1000,limit:1000},                       // requests/hours used today vs daily limit
  activeDays:[0,3,4,5,6,7,8,11,12,13,16,17,19,22,23,24,25,28,29,31,34,35,38,41,42].map(n=>dayKey(daysAgo(n))), // 'YYYY-MM-DD' list
  last7:{messages:1469,input:153200000,cacheRead:146200000,output:945200}
};
let USAGE=Object.assign({},SAMPLE,window.orplexUsage||{});
window.setOrplexUsage=function(d){USAGE=Object.assign({},USAGE,d||{});if(document.querySelector('#snav .s-item.on')?.textContent==='Usage')showPage('Usage');};

const fmtTok=n=>n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n);
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function streaks(set){
  let cur=0,d=daysAgo(0);
  if(!set.has(dayKey(d))) d=daysAgo(1);               // today not logged yet doesn't break the streak
  while(set.has(dayKey(d))){cur++;d.setDate(d.getDate()-1);}
  let best=0,run=0;
  [...set].sort().forEach((k,i,arr)=>{
    const prev=i&&new Date(arr[i-1]+'T12:00:00'), now=new Date(k+'T12:00:00');
    run=(i&&Math.round((now-prev)/864e5)===1)?run+1:1;
    best=Math.max(best,run);
  });
  return {cur,best};
}
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
function heatHTML(set){
  const today=daysAgo(0), lastWeek=new Date(today); lastWeek.setDate(today.getDate()-today.getDay());
  const start=new Date(lastWeek); start.setDate(start.getDate()-51*7);
  let cells='';
  for(let i=0;i<52*7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const k=dayKey(d), future=d>today;
    cells+='<i'+(set.has(k)?' class="a"':'')+(future?' style="visibility:hidden"':'')+' title="'+k+'"></i>';
  }
  return cells;
}
function usageHTML(){
  const u=USAGE, set=new Set(u.activeDays), st=streaks(set);
  const pct=u.daily.limit?Math.min(100,Math.round(u.daily.used/u.daily.limit*100)):0;
  const l=u.last7, total=l.input+l.output;
  return `<div class="s-wrap"><h1 class="s-title">Usage</h1>
    <div class="card meter"><h3>Hours ${HELP}</h3>
      <div class="top"><span>Daily</span><span>${pct}% used</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="card"><h3>Activity ${HELP}</h3>
      <div class="stats">
        <div class="stat"><small>Current streak</small><b>${plural(st.cur,'day')}</b></div>
        <div class="stat"><small>Longest streak</small><b>${plural(st.best,'day')}</b></div>
        <div class="stat"><small>Active days</small><b>${set.size}</b></div>
      </div>
      <div class="heat">${heatHTML(set)}</div></div>
    <div class="card"><h3>Last 7 days ${HELP}</h3>
      <div class="stats two">
        <div class="stat"><small>Messages</small><b>${esc(l.messages.toLocaleString('en-US'))}</b></div>
        <div class="stat"><small>Total tokens</small><b>${fmtTok(total)}</b></div>
      </div>
      <div class="lines">
        <div class="ln"><span>Input tokens</span><span>${fmtTok(l.input)}</span></div>
        <div class="ln"><span>Read from cache ${HELP}</span><span>${fmtTok(l.cacheRead)}</span></div>
        <div class="ln"><span>Output tokens</span><span>${fmtTok(l.output)}</span></div>
      </div></div></div>`;
}
// ---------- Chat toolbar: tasks / terminal / files open a right-panel tab, last button shows/hides the right panel ----------
function setRightPanel(show){
  document.body.classList.toggle('rp-hidden',!show);
  $('#rptoggle').classList.toggle('on',show);
}
$('#rptoggle').addEventListener('click',()=>setRightPanel(document.body.classList.contains('rp-hidden')));
$('#tools').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tool]'); if(!b) return;
  const r=rget(), name=b.dataset.tool;
  let i=r.tabs.findIndex(t=>t.n===name);

document.addEventListener('keydown',e=>{
  // 1) recording a new shortcut
  if(ksCapture){
    e.preventDefault();e.stopPropagation();
    if(e.code==='Escape'){ksCapture=null;ksRefresh();return;}
    const combo=ksCombo(e); if(!combo) return;            // still holding only modifiers
    const str=ksStr(combo), id=ksCapture, hasMod=combo.includes('Ctrl')||combo.includes('Alt'), isF=/^F\d/.test(combo[combo.length-1]);
    let err='';
    if(!hasMod&&!isF) err='Use Ctrl or Alt together with a key.';
    else if(KS_RESERVED.includes(str)) err=str+' is reserved by the system.';
    else {const other=KS_DEFS.find(d=>d.id!==id&&ksStr(ksKeys(d))===str); if(other) err=str+' is already used by “'+other.label+'”.';}
    if(err){ksErr={[id]:err};ksRefresh();return;}
    const def=KS_DEFS.find(d=>d.id===id);
    if(str===ksStr(def.keys)) delete KS_OVR[id]; else KS_OVR[id]=combo;
    ksSave();ksCapture=null;ksErr={};ksRefresh();

  }
  // 2) running a shortcut
  const combo=ksCombo(e); if(!combo||e.repeat) return;
  const str=ksStr(combo), def=KS_DEFS.find(d=>ksStr(ksKeys(d))===str); if(!def) return;

  if(KS_ACTIONS[def.id]) KS_ACTIONS[def.id]();
  window.dispatchEvent(new CustomEvent('orplex:shortcut',{detail:{id:def.id,keys:str}}));
},true);

function skillsListHTML(q){
  q=(q||'').trim().toLowerCase();
  const hit=SKILL_LIST.filter(k=>!q||(k.name+' '+k.description+' '+(k.category||'')).toLowerCase().includes(q));
  if(!hit.length) return '<div class="sk-empty">No skills match “'+esc(q)+'”.</div>';
  let out='',cat=null;
  hit.forEach(k=>{
    if(k.category&&k.category!==cat){cat=k.category;out+=`<div class="sk-cat">${esc(cat)} · ${hit.filter(x=>x.category===cat).length}</div>`;}
    out+=`<div class="sk"><span class="sk-ic"><svg class="i"><use href="#spark"/></svg></span><div class="sk-body"><b>${esc(k.name)}</b><p title="${esc(k.description).replace(/"/g,'&quot;')}">${esc(k.description)}</p></div><div class="sk-act"><button class="btn soft sm" data-skedit="${esc(k.id)}">Edit</button><button class="sw" role="switch" aria-label="${esc(k.name)}" aria-checked="${skillOn(k)}" data-skill="${esc(k.id)}"></button></div></div>`;
  });
  return out;
}

    const id=pv.dataset.prov, on=ACC.providers[id], host=window.orplexHost, fn=host&&(on?host.disconnect:host.connect);

    if(typeof fn==='function'){Promise.resolve(fn.call(host,id)).then(r=>{ACC.providers[id]=!on;showPage('Account');}).catch(()=>{note.textContent='Couldn\'t update '+id+'.';});}

function saveAcc(){
  const v=$('#a-input').value.trim(), key=accEdit;
  if(key==='name'&&(!v||v.length>40)) accErr='Display name must be 1–40 characters.';
  else if(key==='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) accErr='Enter a valid email address.';
  else{
    ACC[key]=v; accEdit=null; accErr='';
    try{localStorage.setItem('orplex-account',JSON.stringify({name:ACC.name,email:ACC.email}));}catch(e){}
    window.dispatchEvent(new CustomEvent('orplex:account',{detail:{field:key,value:v}}));
    updateAvatar();
  }
  const keep=accEdit; showPage('Account'); if(keep){const i=$('#a-input');i.value=v;i.focus();}
}

  if(t.closest('#mp-back')){mp.view='list';return rerender();}
  const rm=t.closest('.mp-rm'); if(rm){mp.list=mp.list.filter(p=>String(p.id)!==rm.dataset.id);saveProviders();return rerender();}
  if(t.closest('#mp-show')){const k=$('#mp-key'),show=k.type==='password';k.type=show?'text':'password';$('#mp-show').textContent=show?'Hide':'Show';return;}
  if(t.closest('#mp-save')){
    const prov=$('#mp-prov').value, key=$('#mp-key').value.trim(), model=$('#mp-model').value.trim(), base=$('#mp-base').value.trim();
    let err='';
    if(!key) err='Paste your API key.';
    else if(!model) err='Enter a model ID.';
    else if(!/^https?:\/\//i.test(base)) err='Base URL must start with http:// or https://';
    $('#mp-err').textContent=err; if(err) return;
    mp.list.push({id:Date.now(),prov,name:PROVIDERS[prov].n,key,model,base});
    saveProviders(); mp.view='list'; rerender();
  }
});
$('#smain').addEventListener('change',e=>{
  if(e.target.id!=='mp-prov') return;
  const v=PROVIDERS[e.target.value], a=$('#mp-setup');
  $('#mp-base').value=v.base; $('#mp-model').placeholder=v.ph;
  a.style.display=v.key?'':'none'; if(v.key) a.href=v.key;
  $('#mp-desc').innerHTML=provDesc(v);
});
// ---------- Database ----------
// Host hooks (optional): window.orplexHost.exportDatabase() / .importDatabase(file). Without a host, the preview just says so.
function databaseHTML(){
  return `<div class="s-wrap"><h1 class="s-title">Database</h1>
    <p class="s-sub">Your chats, runs, keys and learning live on this device. Export them as one portable file and import on any other machine.</p>
    <div class="card">
      <div class="db-row"><div><b>Export local database</b><p>One JSON file with every model — SHA-256 checksummed, portable anywhere.</p></div><button class="btn" id="db-export">Export .json</button></div>
      <div class="db-row"><div><b>Import database</b><p>Restores an exported file. Corrupt or forged models are skipped with reasons.</p></div><button class="btn" id="db-import">Choose file</button><input type="file" id="db-file" accept=".json,application/json" hidden></div>
      <div class="note" id="db-note" role="status">Import replaces rows by model checksum — re-running the same file is a no-op for intact data.</div>
    </div></div>`;
}
(function(){
  const say=t=>{const n=$('#db-note'); if(n) n.textContent=t;};
  $('#smain').addEventListener('click',e=>{
    if(!document.getElementById('db-export')) return;
    if(e.target.closest('#db-import')) return $('#db-file').click();
    if(e.target.closest('#db-export')){
      const host=window.orplexHost;
      window.dispatchEvent(new CustomEvent('orplex:db-export'));
      if(host&&typeof host.exportDatabase==='function'){say('Exporting…');Promise.resolve(host.exportDatabase()).then(()=>say('Database exported.')).catch(()=>say('Couldn\'t export the database.'));}
      else say('Export isn\'t connected in this preview.');
    }
  });
  $('#smain').addEventListener('change',e=>{
    if(e.target.id!=='db-file') return;
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const host=window.orplexHost;
    window.dispatchEvent(new CustomEvent('orplex:db-import',{detail:{file:f}}));
    if(host&&typeof host.importDatabase==='function'){say('Importing…');Promise.resolve(host.importDatabase(f)).then(r=>say(typeof r==='string'&&r?r:'Import finished.')).catch(()=>say('Couldn\'t import that file.'));}
    else say('Import isn\'t connected in this preview.');
    e.target.value='';
  });
})();
// Warm models. Host hook (optional): window.orplexHost.warmModels()
$('#smain').addEventListener('click',e=>{
  if(!e.target.closest('#mp-warm')) return;
  const note=$('#warm-note'), host=window.orplexHost;
  window.dispatchEvent(new CustomEvent('orplex:warm-models'));
  if(host&&typeof host.warmModels==='function'){note.textContent='Warming models…';Promise.resolve(host.warmModels()).then(r=>note.textContent=typeof r==='string'&&r?r:'Every verified model is live — nothing to warm.').catch(()=>note.textContent='Couldn\'t warm models.');}
  else note.textContent='Warming isn\'t connected in this preview.';
});
// ---------- Integrations (placeholders) ----------
// Real data comes from the host app:  window.setOrplexIntegrations({connected:[{id,name,where,tools,url,on}], popular:['Name',...]})  or preset window.orplexIntegrations
const INT_SAMPLE={
  connected:[
    {id:'example-server-1',name:'example-server-1',where:'This computer',tools:12,url:'https://mcp.example.com/one',on:true},
    {id:'example-server-2',name:'example-server-2',where:'This computer',tools:8,url:'https://mcp.example.com/two',on:true}
  ],
  popular:['Gmail','Google Calendar','Google Drive','Slack','Notion','Linear','PostHog','Sentry','Stripe','Supabase','HubSpot','Outlook']
};
let INT=Object.assign({},INT_SAMPLE,window.orplexIntegrations||{});
window.setOrplexIntegrations=function(d){INT=Object.assign({},INT,d||{});if(document.body.classList.contains('integrations-open'))renderInt();};
const intHue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h;};
const intSlug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function renderInt(){
  const root=$('#int-in'); if(!root) return;
  const q=($('#int-q')&&$('#int-q').value)||'', had=document.activeElement&&document.activeElement.id==='int-q';
  const have=new Set(INT.connected.map(c=>c.id));
  root.innerHTML=`<div class="int-wrap">
    <div class="int-head"><h1>Integrations</h1><div class="int-tools">
      <label class="int-search"><svg class="i"><use href="#search"/></svg><input id="int-q" placeholder="Explore more integrations" autocomplete="off" spellcheck="false" value="${esc(q).replace(/"/g,'&quot;')}"></label>
      <button class="btn soft" id="int-custom">Custom</button></div></div>
    <div class="int-note" id="int-note" role="status"></div>
    ${INT.connected.length?INT.connected.map(c=>`<div class="int-row" data-id="${esc(c.id)}"><svg class="i"><use href="#laptop"/></svg><span><span class="nm">${esc(c.name)}</span><small>${esc(c.where)} · ${c.tools} tools · ${esc(c.url)}</small></span><span class="sp"></span><button class="btn soft sm${c.on?'':' off'}" data-tog="${esc(c.id)}">${c.on?'<svg class="i" style="width:14px;height:14px;margin-right:6px"><use href="#check"/></svg>On':'Off'}</button><button class="btn soft icon sm" data-del="${esc(c.id)}" aria-label="Remove ${esc(c.name)}" title="Remove"><svg class="i"><use href="#trash"/></svg></button></div>`).join(''):'<div class="int-empty">No integrations connected yet.</div>'}
    <div class="int-h">Popular</div>
    <div class="int-grid" id="int-grid">${INT.popular.map(n=>{const id=intSlug(n),added=have.has(id);return `<button class="int-tile${added?' added':''}" data-add="${esc(n)}" data-name="${esc(n.toLowerCase())}"${added?' disabled':''}><span class="int-ic" style="background:hsl(${intHue(n)},42%,42%)">${esc(n[0])}</span><span class="nm">${esc(n)}</span><svg class="i"><use href="#${added?'check':'plus'}"/></svg></button>`;}).join('')}</div>
  </div>`;
  filterInt(); if(had){const i=$('#int-q');i.focus();i.setSelectionRange(i.value.length,i.value.length);}
}
function filterInt(){const q=(($('#int-q')||{}).value||'').trim().toLowerCase();document.querySelectorAll('#int-grid .int-tile').forEach(t=>t.style.display=t.dataset.name.includes(q)?'':'none');}
$('#integrations').addEventListener('input',e=>{if(e.target.id==='int-q')filterInt();});
$('#integrations').addEventListener('click',e=>{
  const add=e.target.closest('[data-add]');
  if(add){const n=add.dataset.add;window.dispatchEvent(new CustomEvent('orplex:integration-add',{detail:{name:n}}));INT.connected.push({id:intSlug(n),name:intSlug(n),where:'This computer',tools:0,url:'https://mcp.example.com/'+intSlug(n),on:true});return renderInt();}
  const tog=e.target.closest('[data-tog]');
  if(tog){const c=INT.connected.find(x=>x.id===tog.dataset.tog);if(c){c.on=!c.on;window.dispatchEvent(new CustomEvent('orplex:integration-toggle',{detail:{id:c.id,on:c.on}}));}return renderInt();}
  const del=e.target.closest('[data-del]');
  if(del){window.dispatchEvent(new CustomEvent('orplex:integration-remove',{detail:{id:del.dataset.del}}));INT.connected=INT.connected.filter(x=>x.id!==del.dataset.del);return renderInt();}
  if(e.target.closest('#int-custom')){
    const host=window.orplexHost;window.dispatchEvent(new CustomEvent('orplex:integration-custom'));
    const note=$('#int-note');
    if(host&&typeof host.addCustomIntegration==='function'){Promise.resolve(host.addCustomIntegration()).catch(()=>{note.textContent='Couldn\'t add a custom integration.';});}
    else note.textContent='Custom integrations aren\'t connected in this preview.';
  }
});
// Delete account / Sign out. Host hooks (optional): window.orplexHost.deleteAccount() / .signOut()
(function(){
  const DEL_BTN='<button class="btn danger" id="acc-delete">Delete account</button>';
  $('#smain').addEventListener('click',e=>{
    const t=e.target; if(!document.getElementById('acc-delete')&&!document.getElementById('acc-del-confirm')) return;
    const host=window.orplexHost, box=$('#acc-del-actions'), note=$('#acc-del-note');
    if(t.closest('#acc-delete')){box.innerHTML='<button class="btn soft" id="acc-del-cancel">Cancel</button><button class="btn danger" id="acc-del-confirm">Yes, delete my account</button>';note.textContent='This can\'t be undone.';return;}
    if(t.closest('#acc-del-cancel')){box.innerHTML=DEL_BTN;note.textContent='';return;}
    if(t.closest('#acc-del-confirm')){
      window.dispatchEvent(new CustomEvent('orplex:account-delete'));
      if(host&&typeof host.deleteAccount==='function'){note.textContent='Deleting…';Promise.resolve(host.deleteAccount()).catch(()=>{note.textContent='Couldn\'t delete the account.';box.innerHTML=DEL_BTN;});}
      else{note.textContent='Account deletion isn\'t connected in this preview.';box.innerHTML=DEL_BTN;}
      return;
    }
    if(t.closest('#acc-signout')){
      window.dispatchEvent(new CustomEvent('orplex:account-signout'));
      const n=$('#acc-out-note');
      if(host&&typeof host.signOut==='function'){Promise.resolve(host.signOut()).catch(()=>{n.textContent='Couldn\'t sign out.';});}
      else n.textContent='Sign-out isn\'t connected in this preview.';
    }
  });
})();
function showPage(name){
  document.querySelectorAll('#snav .s-item').forEach(b=>b.classList.toggle('on',b.textContent===name));
  const m=$('#smain');
  m.innerHTML = name==='General' ? generalHTML() : name==='Keyboard shortcuts' ? keyboardHTML() : name==='Skills' ? skillsHTML() : name==='Account' ? accountHTML() : name==='Usage' ? usageHTML() : name==='Appearance' ? appearanceHTML() : name==='Model Providers' ? providersHTML() : name==='Database' ? databaseHTML()
    : '<div class="s-wrap"><h1 class="s-title"></h1><div class="ph" style="height:260px"><div><h2></h2></div></div></div>';
  if(!['General','Keyboard shortcuts','Skills','Account','Usage','Appearance','Model Providers','Database'].includes(name)){ m.querySelector('.s-title').textContent=name; m.querySelector('.ph h2').textContent=name+' settings go here'; }
  m.scrollTop=0;
}
SPAGES.forEach(n=>{
  const b=document.createElement('button');
  b.className='s-item'; b.textContent=n;
  b.addEventListener('click',()=>showPage(n));
  $('#snav').appendChild(b);
});
$('#ssearch').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('#snav .s-item').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'':'none');
});
// rail: gear opens the settings page, any other icon returns to the app
document.querySelector('.rail').addEventListener('click',e=>{
  const b=e.target.closest('button[data-r]'); if(!b) return;
  if(b.dataset.r==='layout'){document.body.classList.toggle('collapsed');return;}   // layout icon = toggle sidebar, doesn't change the active view
  document.querySelectorAll('.rail button').forEach(x=>x.classList.toggle('on',x===b));
  document.body.classList.toggle('settings-open',b.dataset.r==='settings');
  document.body.classList.toggle('integrations-open',b.dataset.r==='apps');
  if(b.dataset.r==='apps') renderInt();
});
// layout icon reflects sidebar state (covers the Ctrl+B shortcut too)
(function(){const b=$('#layoutbtn'),sync=()=>b&&b.setAttribute('aria-pressed',String(!document.body.classList.contains('collapsed')));
  new MutationObserver(sync).observe(document.body,{attributes:true,attributeFilter:['class']});sync();})();
$('#smain').addEventListener('click',e=>{const t=e.target.closest('.theme');if(t)applyTheme(t.dataset.theme);});
// hover (or focus) the avatar -> daily usage popover, driven by the same USAGE data as the Usage page
(function(){
  const av=$('#avatar'); if(!av) return;
  const pop=document.createElement('div'); pop.className='usage-pop'; pop.id='usage-pop'; pop.setAttribute('role','tooltip'); document.body.appendChild(pop);
  function show(){
    const u=USAGE, pct=u.daily&&u.daily.limit?Math.min(100,Math.round(u.daily.used/u.daily.limit*100)):0;
    pop.innerHTML='<div class="top"><span>Daily</span><span>'+pct+'% used</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
    const a=av.getBoundingClientRect(), r=document.querySelector('.rail').getBoundingClientRect();
    pop.style.left=(r.right+6)+'px';
    const h=pop.offsetHeight; pop.style.top=Math.max(8,Math.min(innerHeight-h-8,a.bottom-h+8))+'px';
    pop.classList.add('show');
  }
  const hide=()=>pop.classList.remove('show');
  av.addEventListener('mouseenter',show); av.addEventListener('mouseleave',hide);
  av.addEventListener('focus',show); av.addEventListener('blur',hide);
  // click (or Enter/Space) -> open Settings on the Account page
  function openAccount(){
    hide();
    document.querySelectorAll('.rail button').forEach(x=>x.classList.toggle('on',x.dataset.r==='settings'));
    document.body.classList.remove('integrations-open');
    document.body.classList.add('settings-open');
    showPage('Account');
  }
  document.querySelector('.rail').addEventListener('click',e=>{if(e.target.closest('#avatar'))openAccount();}); // same click path as the gear
  av.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openAccount();}});
})();
applyTheme(getPref());
updateAvatar();
showPage('General');
render();
</script>
