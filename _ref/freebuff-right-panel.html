<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freebuff Right Panel</title>
<style>
:root{
  color-scheme:dark;
  --bar:#171717; --bg:#1e1e1e; --pill:#2b2b2b; --pill2:#333; --hover:#272727;
  --text:#e8e8e8; --dim:#8f8f8f; --line:#2a2a2a;
  --brand:#f2994a; --accent:#f2994a; --btn-ink:#2a1604;
  --add:#8fd18a; --del:#f07178; --mod:#e8a15a;
  --okbg:#8fd18a26; --errbg:#f0717826;
  --page:#121212; --edge:#000; --tabhover:#202020; --ibhover:#2a2a2a;
  --pop:#262626; --popline:#363636; --pophover:#333; --shadow:#0008;
  --browse:#202020; --term:#d6d6d6; --sel:#2a2a2a; --scroll:#3a3a3a;
  --toast:#2e2e2e; --card:#242424; --mid:#a8a8a8; --em:#b4b4b4; --emhov:#fff;
  --fi:#b5b5b5; --li:#cfcfcf; --bullet:#555;
  --scrim:#000a; --segon:#f3cba5; --segink:#2a1604; --dlgin:#1f201f;
  --font:'Google Sans','Segoe UI',Roboto,system-ui,sans-serif;
}
:root[data-theme=light]{
  color-scheme:light;
  --bar:#ebe9e4; --bg:#f8f7f4; --pill:#ebe9e4; --pill2:#dedbd4; --hover:#efede8;
  --text:#1f1f1e; --dim:#707069; --line:#e2e0da;
  --brand:#f5a05a; --accent:#c2570c; --btn-ink:#2b1505;
  --add:#2e8b3d; --del:#d33f49; --mod:#c9701a;
  --okbg:#2e8b3d1f; --errbg:#d33f4920;
  --page:#e4e2dd; --edge:#d6d3cc; --tabhover:#e2dfd8; --ibhover:#e6e3dc;
  --pop:#fff; --popline:#dcd9d2; --pophover:#efede8; --shadow:#0002;
  --browse:#f2f0ec; --term:#262625; --sel:#e8e5de; --scroll:#c9c6be;
  --toast:#fff; --card:#efede8; --mid:#6a6a64; --em:#5b5b55; --emhov:#000;
  --fi:#6b6b64; --li:#33332f; --bullet:#b5b2aa;
  --scrim:#0005; --segon:#fff; --segink:#1f1f1e; --dlgin:#f2f0ec;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--page);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:flex-end}
svg{width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:0}

/* ===== PANEL ===== */
.fb-panel{width:460px;max-width:100%;height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;border-left:1px solid var(--edge)}

/* tab bar */
.fb-tabs{min-width:0;height:48px;background:var(--bar);display:flex;align-items:flex-end;flex:none;padding-left:4px;-webkit-app-region:drag}
.fb-tab{height:40px;display:flex;align-items:center;gap:8px;padding:0 9px;border-radius:10px 10px 0 0;color:var(--dim);cursor:pointer;min-width:34px;flex:0 1 74px;overflow:hidden;position:relative;-webkit-app-region:no-drag}
.fb-tab .dot{position:absolute;top:9px;right:5px;width:6px;height:6px;border-radius:50%;background:#f28c3c;box-shadow:0 0 6px #f28c3c99}
.fb-tab:hover{background:var(--tabhover)}
.fb-tab.on{background:var(--bg);color:var(--text);flex:0 0 106px;padding:0 12px}
.fb-tab .ti{width:17px;height:17px;flex:none}
.fb-tab .tl{font-size:13px;width:26px;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,#000 40%,transparent);mask-image:linear-gradient(90deg,#000 40%,transparent);pointer-events:none}
.fb-tab.on .tl{width:34px}
.fb-tab .tx{width:16px;height:16px;border-radius:50%;flex:none;margin-left:auto;display:none;color:var(--dim)}
.fb-tab.on .tx{display:block}
.fb-tab .tx:hover{color:var(--text);background:var(--pill2)}
.fb-plus{width:32px;height:32px;margin:0 0 4px 4px;padding:7px;border-radius:8px;color:var(--dim);flex:none;-webkit-app-region:no-drag}
.fb-plus:hover{background:var(--ibhover);color:var(--text)}
.fb-spacer{flex:1}
.fb-pop{position:absolute;top:44px;left:150px;background:var(--pop);border:1px solid var(--popline);border-radius:10px;padding:4px;z-index:20;display:none;min-width:150px;box-shadow:0 10px 30px var(--shadow)}
.fb-pop.on{display:block}
.fb-pop button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:7px;font-size:13.5px}
.fb-pop button:hover{background:var(--pophover)}
.fb-pop i{width:16px;height:16px;display:block;color:var(--dim)}

/* views */
.fb-view{flex:1;min-height:0;display:none;flex-direction:column;background:var(--bg)}
.fb-view.on{display:flex}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px}

/* changes */
.ch-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex:none}
.pill{padding:7px 14px;border-radius:999px;font-size:14.5px;color:var(--dim)}
.pill:hover{color:var(--text)}
.pill.on{background:var(--pill2);color:var(--text)}
.tot{font-size:14.5px;display:flex;gap:10px;margin-left:6px}
.tot .a{color:var(--add)} .tot .d{color:var(--del)}
.ch-list{flex:1;padding:0 8px 8px;-webkit-mask-image:linear-gradient(#000 92%,transparent);mask-image:linear-gradient(#000 92%,transparent)}
.row{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:8px;cursor:pointer;font-size:15px}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row .fi{width:18px;height:18px;flex:none}
.row .fi.a{color:var(--add)} .row .fi.m{color:var(--mod)} .row .fi.x{color:var(--del)}
.row .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.row .p b{font-weight:400;color:var(--text)}
.row .n{width:54px;text-align:right;font-size:14.5px;flex:none}
.row .n.a{color:var(--add)} .row .n.d{color:var(--del)}
.row .n.z{color:var(--dim)}

/* browser */
.br-bar{display:flex;align-items:center;gap:4px;padding:10px 12px;flex:none}
.ib{width:32px;height:32px;padding:7px;border-radius:8px;color:var(--dim);flex:none}
.ib:hover{background:var(--ibhover);color:var(--text)}
.ib[disabled]{opacity:.35;pointer-events:none}
.url{flex:1;min-width:0;height:38px;border-radius:12px;background:var(--pill);padding:0 14px;margin:0 6px;font-size:14.5px}
.url::placeholder{color:var(--dim)}
.br-body{flex:1;position:relative;min-height:0;background:var(--browse);border-top:1px solid var(--line)}
.br-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--dim)}
.br-empty .gl{width:34px;height:34px}
.br-empty h3{font-size:18px;font-weight:500;color:var(--mid)}
.btn-g{display:flex;align-items:center;gap:8px;background:var(--brand);color:var(--btn-ink);padding:10px 18px;border-radius:12px;font-size:14.5px;font-weight:500}
.btn-g:hover{filter:brightness(1.07)}
.btn-g i{width:17px;height:17px;display:block}
.br-body iframe{width:100%;height:100%;border:0;background:#fff;display:none}

/* browser settings menu */
#v-browser{position:relative}
.bm{position:absolute;top:56px;right:12px;width:min(340px,calc(100% - 24px));max-height:calc(100% - 68px);background:var(--pop);border:1px solid var(--popline);border-radius:14px;box-shadow:0 14px 40px var(--shadow);padding:4px 0 8px;z-index:25;display:none}
.bm.on{display:block}
.bm h5{font-size:13.5px;font-weight:500;padding:14px 18px 8px;color:var(--text)}
.bm .mi{display:flex;align-items:center;gap:12px;width:calc(100% - 16px);margin:0 8px;height:36px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--em);text-align:left}
.bm .mi:hover{background:var(--pophover);color:var(--text)}
.bm .mi i{width:16px;height:16px;display:block;flex:none}
.bm .mi .cv{margin-left:auto;width:15px;height:15px;transition:transform .12s}
.bm .mi.open .cv{transform:rotate(180deg)}
.bm .mi .rec{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#ef4444;animation:pulse 1.1s infinite}
.bm hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.bm .sub{padding:2px 8px 6px 38px}
.bm .sub .mi{width:100%;margin:0;height:32px;font-size:13.5px}
.bm .sub .none{padding:6px 10px;font-size:13px;color:var(--dim)}

/* terminal */
.tm{flex:1;padding:14px 16px;font:13.5px/1.6 Consolas,'Cascadia Mono',Menlo,monospace;cursor:text;color:var(--term)}
.tm .o{white-space:pre-wrap;word-break:break-word}
.tm .e{color:var(--del)}
.tm .pr{display:flex;gap:8px}
.tm .pr span{color:var(--accent);white-space:nowrap}
.tm .pr input{flex:1;font:inherit;min-width:0;caret-color:var(--accent)}

/* files */
.fl-bar{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;flex:none}
.fl-search{flex:1;min-width:0;height:36px;background:var(--pill);border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--dim)}
.fl-search i{width:16px;height:16px;display:block;flex:none}
.fl-search input{flex:1;min-width:0;font-size:14.5px;color:var(--text)}
.fl-search input::placeholder{color:var(--dim)}
.fl-btn{width:36px;height:36px;border-radius:12px;background:var(--pill);padding:9px;color:var(--text);flex:none}
.fl-btn:hover{background:var(--pill2)}
.tree{flex:1;padding:4px 12px 12px}
.tr{display:flex;align-items:center;gap:8px;height:30px;border-radius:7px;cursor:pointer;font-size:14.5px;padding-right:6px}
.tr:hover{background:var(--hover)}
.tr .cv{width:14px;height:14px;flex:none;color:var(--dim);transition:transform .12s}
.tr.open .cv{transform:rotate(90deg)}
.tr .fi{width:16px;height:16px;flex:none;color:var(--fi)}
.tr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .pp{color:var(--dim);font-size:12.5px;margin-left:6px}
.tree .none{padding:16px;color:var(--dim);font-size:13.5px}
.tr.dim{opacity:.5}

/* breathing globe */
.br-empty .gl{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.16);opacity:1}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* queue */
.q{flex:1;padding:14px 12px;display:flex;flex-direction:column}
.q-empty{margin:auto;color:var(--dim);font-size:14.5px}
.qi{display:flex;gap:12px;padding:12px;border-radius:12px;background:var(--card);margin-bottom:8px}
.qs{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;margin-top:1px}
.qs svg{width:11px;height:11px}
.qs.ok{background:var(--okbg);color:var(--add)}
.qs.err{background:var(--errbg);color:var(--del)}
.qs.run{background:#f28c3c26;color:#f28c3c}
.qm{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt{font-size:13px;color:var(--dim);margin-top:3px}
.qt.dots::after{content:'';animation:dots 1.3s steps(1) infinite}

/* scratch */
.sc{flex:1;padding:16px;display:flex;flex-direction:column}
.sc-empty{margin:auto;color:var(--dim);font-size:14.5px}
.sb{margin-bottom:20px}
.sb h4{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:8px;display:flex;align-items:center}
.sb.live h4::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:8px;animation:pulse 1.2s infinite}
.sb ul{list-style:none}
.sb li{font-size:14px;line-height:1.55;color:var(--li);padding-left:14px;position:relative;margin-bottom:4px}
.sb li::before{content:'';position:absolute;left:0;top:.68em;width:5px;height:5px;border-radius:50%;background:var(--bullet)}

/* empty state */
.em{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 0 40px 25.5%}
.em button{display:flex;align-items:center;gap:14px;height:43px;color:var(--em);font-size:15px;text-align:left;width:max-content;padding-right:20px}
.em button:hover{color:var(--emhov)}
.em i{width:17px;height:17px;display:block;flex:none}

.theme{position:fixed;left:16px;top:16px;width:38px;height:38px;padding:10px;border-radius:12px;background:var(--pill);color:var(--text);z-index:40}
.theme:hover{background:var(--pill2)}

/* import modal */
.md{position:absolute;inset:0;background:var(--scrim);z-index:50;display:none;align-items:center;justify-content:center;padding:14px 14px 70px}
.md.on{display:flex}
.dlg{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--pop);border:1px solid var(--popline);border-radius:18px;padding:18px;box-shadow:0 20px 60px var(--shadow);display:flex;flex-direction:column;gap:12px}
.mdh{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.mdh>i{width:22px;height:22px;color:var(--em);display:block}
.mdh h3{flex:1;font-size:19px;font-weight:500}
.seg{display:flex;background:var(--dlgin);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;height:36px;border-radius:11px;font-size:14.5px;color:var(--dim)}
.seg button.on{background:var(--segon);color:var(--segink)}
.mdsel{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 14px;border-radius:14px;background:var(--dlgin);border:1px solid var(--line);font-size:14.5px;text-align:left}
.mdcv{margin-left:auto;width:16px;height:16px;color:var(--dim);flex:none;transition:transform .12s;display:block}
.mdcv.up{transform:rotate(180deg)}
.ddl{background:var(--dlgin);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:-6px}
.ddl button{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:8px;font-size:14px;text-align:left}
.ddl button:hover{background:var(--pophover)}
.mdcard{background:var(--dlgin);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mdrow{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 14px;font-size:14.5px;text-align:left}
.mdrow+.mdrow{border-top:1px solid var(--line)}
.mdrow:hover{background:var(--hover)}
.mdrow>i{width:18px;height:18px;color:var(--em);flex:none;display:block}
.mdrow>span:not(.ck){flex:1}
.mdrow.sub{padding-left:44px;height:38px;font-size:14px}
.mdrow.sub .ck{margin-left:0}
.ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--dim);flex:none;display:grid;place-items:center;margin-left:auto}
.ck.on{background:var(--dim);color:var(--bg)}
.ck svg{width:13px;height:13px;stroke-width:2.8}
.bi{width:18px;height:18px;border-radius:50%;flex:none;position:relative;display:block}
.bi.c::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#4285f4;border:1.5px solid #fff}
.mdf{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:6px}
.tbtn{padding:9px 12px;border-radius:10px;font-size:14.5px;font-weight:500}
.tbtn:hover{background:var(--pophover)}
.btn-g.sm{padding:9px 18px;border-radius:10px}

/* toast */
.toast{position:absolute;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--toast);border:1px solid var(--popline);padding:9px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<button class="theme" id="theme" title="Toggle light / dark"></button>

<aside class="fb-panel" id="fb">
  <div class="fb-tabs" id="tabs"></div>
  <div class="fb-pop" id="pop"></div>

  <!-- EMPTY (nothing open) -->
  <section class="fb-view on" id="v-null">
    <div class="em" id="em"></div>
  </section>

  <!-- QUEUE -->
  <section class="fb-view" id="v-queue">
    <div class="q scroll" id="q"></div>
  </section>

  <!-- SCRATCH -->
  <section class="fb-view" id="v-scratch">
    <div class="sc scroll" id="sc"></div>
  </section>

  <!-- CHANGES -->
  <section class="fb-view" id="v-changes">
    <div class="ch-head">
      <button class="pill" data-f="all">All</button>
      <button class="pill on" data-f="unc">Uncommitted</button>
      <div class="tot"><span class="a" id="ta"></span><span class="d" id="td"></span></div>
    </div>
    <div class="ch-list scroll" id="chl"></div>
  </section>

  <!-- BROWSER -->
  <section class="fb-view" id="v-browser">
    <div class="br-bar">
      <button class="ib" id="bBack" data-i="back" disabled></button>
      <button class="ib" id="bFwd" data-i="fwd" disabled></button>
      <button class="ib" id="bRel" data-i="reload"></button>
      <input class="url" id="url" placeholder="Search or enter URL" spellcheck="false">
      <button class="ib" id="bExt" data-i="ext"></button>
      <button class="ib" id="bMore" data-i="more" title="Browser settings"></button>
    </div>
    <div class="br-body">
      <div class="br-empty" id="bEmpty">
        <div class="gl" data-i="globe"></div>
        <h3>Start browsing</h3>
        <button class="btn-g" id="imp"><i data-i="download"></i>Import browser data</button>
      </div>
      <iframe id="frame"></iframe>
    </div>
    <div class="bm scroll" id="bm"></div>
  </section>

  <!-- TERMINAL -->
  <section class="fb-view" id="v-terminal">
    <div class="tm scroll" id="tm"></div>
  </section>

  <!-- FILES -->
  <section class="fb-view" id="v-files">
    <div class="fl-bar">
      <label class="fl-search"><i data-i="search"></i><input id="flq" placeholder="Filter files" spellcheck="false"></label>
      <button class="fl-btn" id="newF" data-i="fileplus" title="New file"></button>
      <button class="fl-btn" id="newD" data-i="folderplus" title="New folder"></button>
      <button class="fl-btn" id="upl" data-i="upload" title="Upload"></button>
      <input type="file" id="fin" multiple hidden>
    </div>
    <div class="tree scroll" id="tree"></div>
  </section>

  <div class="md" id="md"><div class="dlg" id="dlg"></div></div>
  <input type="file" id="cfile" hidden>
  <div class="toast" id="toast"></div>
</aside>

<script>
/* ---------- icons ---------- */
const I={
 branch:'<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
 laptop:'<rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 20h20"/>',
 term:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m7 9 3 3-3 3M13 15h4"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
 fadd:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/>',
 fmod:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M10 12l-2 2 2 2M14 12l2 2-2 2"/>',
 fdel:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M10 13l4 4M14 13l-4 4"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 chev:'<path d="m9 6 6 6-6 6"/>',
 fileplus:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/>',
 folderplus:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/>',
 upload:'<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>',
 back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',

}

/* ---------- theme (follows system; host can call fb.setTheme('light'|'dark')) ---------- */
const mq=matchMedia('(prefers-color-scheme: light)');let manual=false;
function setTheme(t,m){document.documentElement.dataset.theme=t;$('#theme').innerHTML=svg(t==='dark'?'sun':'moon');if(m)manual=true}
setTheme(mq.matches?'light':'dark');
mq.addEventListener('change',e=>{if(!manual)setTheme(e.matches?'light':'dark')});
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true);
fb.setTheme=t=>setTheme(t,true);

/* ---------- init ---------- */
paint();renderTabs();renderCh();renderTree();renderQ();renderSC();
</script>
