<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tool Calls</title>
<style>
:root{
  --bg:#0b0b0d; --panel:#111114; --raise:#18181c; --line:#232329; --line2:#30303a;
  --text:#ededf0; --mute:#8e8e99; --dim:#5b5b66; --acc:#ff6a1a;
  --err:#ff5c6c; --add:#3fb97a; --del:#ff6b6b; --warn:#ffd24c;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;padding:20px 16px 80px;background:radial-gradient(520px 260px at 50% -60px,rgba(255,106,26,.09),transparent 70%),var(--bg)}
#feed{width:100%;max-width:600px}
svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lab{font:600 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:26px 4px 8px;display:flex;align-items:center;gap:10px}
.lab::after{content:"";flex:1;height:1px;background:var(--line)}

/* category colors */
.c-file{--c:#3fd0a4}.c-edit{--c:#ff8a3d}.c-exec{--c:#8f9cff}.c-search{--c:#c68fff}.c-web{--c:#4cc3ff}
.c-media{--c:#ff7ab6}.c-reason{--c:#ffd24c}.c-agent{--c:#b4e04a}.c-bad{--c:#ff5c6c}.c-think{--c:#a9a9bd}
.think{padding:10px 14px 4px;color:var(--mute);font:12.5px/1.7 var(--sans)}
.think p{margin:0 0 8px}
.fail{--c:var(--err)!important}

/* row */
.tc{position:relative;animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.sec>.tc::before{content:"";position:absolute;left:18px;top:32px;bottom:-4px;width:1px;background:linear-gradient(var(--line2),var(--line))}
.sec>.tc:last-child::before{display:none}
.tc-h{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px 7px 8px;margin:3px 0;border-radius:8px;border:0;cursor:pointer;color:var(--mute);font-size:13px;overflow:hidden;transition:background .18s,border-color .18s}
.tc-h:hover{background:var(--panel)}
.tc-h:focus-visible{outline:1.5px solid var(--acc);outline-offset:1px}
.open>.tc-h{background:var(--panel)}
.ic{width:20px;height:20px;display:grid;place-items:center;flex:none;color:var(--c)}
.verb{white-space:nowrap;font-weight:500}
.tgt{display:inline-flex;align-items:center;gap:7px;min-width:0;font:12px var(--mono);color:var(--text)}
.tgt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ext{font:700 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c);line-height:1}
.sp{flex:1}
.meta{font:11.5px var(--mono);color:var(--dim);white-space:nowrap;display:flex;gap:7px;align-items:center}
.meta .a{color:var(--add)} .meta .d{color:var(--del)}
.pill{font:600 11px var(--sans);white-space:nowrap;color:var(--mute)}
.pill::before{content:"·";margin-right:6px;color:var(--dim)}
.fail .pill{color:var(--err)}
.wait .pill{color:var(--warn);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.55}}
.ok{color:var(--add);opacity:.7}
.chev{color:var(--dim);transition:transform .2s;transform:rotate(-90deg)}
.open>.tc-h .chev{transform:rotate(0);color:var(--mute)}

/* running */
.run-st>.tc-h{background:linear-gradient(90deg,rgba(255,106,26,.10),rgba(255,106,26,.02) 60%)}
.run-st .ic{filter:drop-shadow(0 0 5px var(--c));animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 11px var(--c))}}
.run-st .verb{background:linear-gradient(90deg,var(--mute) 30%,#fff 50%,var(--mute) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
.run-st>.tc-h::after{content:"";position:absolute;left:0;bottom:0;height:1.5px;width:40%;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:scan 1.5s ease-in-out infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.spin{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line2);border-top-color:var(--acc);animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}

/* body shell */
.tc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.2,.8,.2,1)}
.open>.tc-b{grid-template-rows:1fr}
.tc-b>.in{overflow:hidden;min-height:0}
.body{margin:2px 2px 8px 38px;border:1px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden}
.path{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 8px 7px 10px;border-bottom:1px solid var(--line);font:11.5px var(--mono);color:var(--dim)}
.path .p{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap}
.path .p b{color:var(--mute);font-weight:500}
.tool{font:600 10.5px var(--mono);font-style:normal;color:var(--c)}
.cp{all:unset;cursor:pointer;display:flex;align-items:center;gap:5px;font:600 10.5px var(--sans);color:var(--mute);transition:.15s}
.cp:hover{color:var(--acc)}
pre{margin:0;padding:8px 0;font:12px/1.65 var(--mono);overflow-x:auto}
.ln{display:flex;padding:0 12px 0 0;white-space:pre;min-width:max-content}
.ln i{font-style:normal;color:var(--dim);width:42px;flex:none;text-align:right;padding-right:12px;user-select:none}
.ln.p{background:rgba(63,185,122,.10);box-shadow:inset 2px 0 var(--add)}
.ln.m{background:rgba(255,107,107,.09);box-shadow:inset 2px 0 var(--del);opacity:.85}
.ln.m span{text-decoration:line-through;text-decoration-color:rgba(255,107,107,.5)}
.k{color:#ff9d5c}.s{color:#8fe3b4}.n{color:#c9a8ff}.c{color:var(--dim);font-style:italic}.jk{color:#9ec5ff}
.term{padding:10px 14px;font:12px/1.65 var(--mono);color:var(--mute);white-space:pre-wrap}
.term .pr{color:#8f9cff}.term .cm{color:var(--text)}.term .g{color:var(--add)}.term .r{color:var(--err)}.term .y{color:var(--warn)}
.kv{padding:6px 14px;font:12px var(--mono)}
.kv div{display:flex;gap:12px;padding:3px 0}
.kv span{color:var(--dim);width:96px;flex:none}
.kv b{font-weight:500;color:var(--text);word-break:break-all}
.chk{padding:8px 14px;font:12.5px var(--sans)}
.chk div{display:flex;align-items:center;gap:9px;padding:3px 0;color:var(--mute)}
.chk .g{width:16px;text-align:center;font-weight:700;flex:none}
.chk .ok2{color:var(--add)}.chk .bad{color:var(--err)}.chk .todo{color:var(--dim)}.chk .skip{color:var(--dim)}
.chk .done{color:var(--dim);text-decoration:line-through}
.chk em{margin-left:auto;font:11px var(--mono);color:var(--dim);font-style:normal}
.hit{display:flex;gap:6px;padding:3px 14px;font:12px var(--mono)}
.hit .f{color:var(--c)} .hit .l{color:var(--dim)} .hit code{color:var(--mute);white-space:pre;overflow:hidden;text-overflow:ellipsis;font:inherit} .hit em{margin-left:auto;color:var(--dim);font-style:normal}
.hits{padding:6px 0}
mark{background:rgba(255,106,26,.25);color:#ffd2b3;border-radius:3px;padding:0 2px}
.wr{padding:9px 14px;border-bottom:1px solid var(--line)} .wr:last-child{border:0}
.wr b{display:block;font:600 13px var(--sans);color:#9ec5ff}
.wr small{display:block;font:11.5px var(--mono);color:var(--add);margin:1px 0 3px}
.wr p{margin:0;color:var(--mute);font-size:12.5px}
.lg{display:flex;gap:10px;padding:3px 14px;font:12px var(--mono);color:var(--mute)}
.lg .lv{width:42px;font-weight:700;flex:none}
.lv.error{color:var(--err)}.lv.warn{color:var(--warn)}.lv.log{color:var(--dim)}.lv.info{color:#8f9cff}
.lgs{padding:6px 0}
.tr{padding:6px 0}
.tr div{display:flex;align-items:center;gap:8px;padding:2px 14px;font:12px var(--mono);color:var(--mute)}
.tr svg{width:12px;height:12px;color:var(--c)}
.tr .m{margin-left:auto;color:var(--dim)} .tr .a{color:var(--add)} .tr .d{color:var(--del)}
.fc{display:flex;align-items:center;gap:12px;padding:12px 14px}
.fc .big{width:30px;height:30px;display:grid;place-items:center;color:var(--c)}
.fc .big svg{width:18px;height:18px}
.fc div b{display:block;font:600 13px var(--sans);color:var(--text)} .fc div small{color:var(--dim);font:11.5px var(--mono)}
.fc button{all:unset;margin-left:auto;cursor:pointer;font:600 12px var(--sans);color:var(--c)}
.fc button:hover{text-decoration:underline}
.bar{height:3px;background:var(--line);overflow:hidden;margin:14px 14px 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,#fff))}
.cap{padding:0 14px 10px;font:11.5px var(--mono);color:var(--dim)}
.ask{padding:12px 14px}
.q{font:600 13px var(--sans);color:var(--text);margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-bottom:1px solid var(--line);box-shadow:inset 2px 0 transparent;cursor:pointer;color:var(--text);font-size:12.5px;transition:.15s}
.opt small{color:var(--dim);font-size:11.5px}
.opt:hover{background:var(--raise)}
.opt.sel{box-shadow:inset 2px 0 var(--c);background:color-mix(in srgb,var(--c) 8%,transparent)}
.free{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--line2);border-radius:6px;color:var(--text);padding:8px 11px;font:12.5px var(--sans)}
.free:focus{outline:none;border-color:var(--c)}
.shot{padding:12px 14px}
.frame{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#0e0e11;margin:0 auto}
.fb{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--raise);border-bottom:1px solid var(--line)}
.fb i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.fb u{margin-left:6px;flex:1;text-decoration:none;font:10.5px var(--mono);color:var(--dim);background:var(--bg);border-radius:5px;padding:2px 8px}
.fv{padding:12px;display:grid;gap:8px}
.fv s{display:block;height:8px;border-radius:4px;background:var(--line);text-decoration:none}
.fv .h{height:34px;border-radius:7px;background:linear-gradient(90deg,var(--line2),var(--line))}
.fv .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fv .g2 s{height:46px;border-radius:7px}
.vp{text-align:center;margin-top:8px;font:11px var(--mono);color:var(--dim)}
.note{padding:6px 14px 10px}
.note h5{margin:8px 0 2px;font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.note p{margin:0;color:var(--mute);font-size:12.5px}
.subhost{padding:6px 6px 0}
.subhost .body{margin-left:36px}
.subhost .tc-h{margin:1px 0}
.subhost .tc{animation:none}
.ans{margin:6px 14px 12px;padding:8px 12px;border-left:2px solid var(--c);color:var(--mute);font:12.5px/1.6 var(--sans)}
.ans b{color:var(--c);font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="feed"></div>

<script>
/* ---------- icons ---------- */
const P={
 file:'<path d="M4 1.5h5L12.5 5v9a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5V2a.5.5 0 0 1 .5-.5ZM9 1.5V5h3.5"/>',
 edit:'<path d="M10.5 2.5l3 3L6 13l-3.5.5L3 10z"/>',

 tabs:'<rect x="2" y="4.5" width="12" height="8.5" rx="1.5"/><path d="M2 7.5h12M5 4.5V3h3v1.5"/>',
 bug:'<path d="M5.5 5.5a2.5 2.5 0 0 1 5 0V10a2.5 2.5 0 0 1-5 0zM2.5 7.5h3M10.5 7.5h3M3 4l2.5 2M13 4l-2.5 2M3 12l2.5-2M13 12l-2.5-2"/>',
 net:'<path d="M2 8h3l1.5-4 3 8L11 8h3"/>',

 sliders:'<path d="M2 5h12M2 11h12"/><circle cx="6" cy="5" r="1.6"/><circle cx="10.5" cy="11" r="1.6"/>',
 key:'<rect x="2.5" y="4" width="11" height="8" rx="1.5"/><path d="M5.5 9.5h5"/>',
 layers:'<path d="M8 2l6 3-6 3-6-3z"/><path d="M2 8l6 3 6-3M2 11l6 3 6-3"/>',

};
const ic=(n,s)=>`<svg viewBox="0 0 16 16"${s?` style="width:${s}px;height:${s}px"`:''}>${P[n]}</svg>`;
const CHEV='<svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>';
const CHECK='<svg class="ok" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const COPY='<svg viewBox="0 0 16 16" style="width:11px;height:11px"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M3 10.5V4a1 1 0 0 1 1-1h6.5"/></svg>';

/* ---------- tool registry: category, icon, verbs [done, active], ext badge ---------- */
const D={
 read_file:{c:'file',i:'eye',v:['Read','Reading'],ext:1},
 list_files:{c:'file',i:'folder',v:['Listed','Listing']},
 extract_archive:{c:'file',i:'archive',v:['Extracted','Extracting']},
 create_file:{c:'file',i:'download',v:['Created','Creating'],ext:1},

 write_file_chunk:{c:'edit',i:'layers',v:['Wrote chunk','Writing chunk'],ext:1},

 batch_edit:{c:'edit',i:'layers',v:['Batch edited','Batch editing']},
 apply_edit_ops:{c:'edit',i:'sliders',v:['Applied ops','Applying ops'],ext:1},

 run_command:{c:'exec',i:'term',v:['Ran','Running']},

 playbook_search:{c:'search',i:'book',v:['Recalled playbook','Checking playbook']},

 browser_navigate:{c:'web',i:'nav',v:['Navigated','Navigating']},

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const extOf=f=>(f.split('.').pop()||'').slice(0,4);
function hl(s){
  return s.replace(/(\/\/.*$)|('[^']*'|"[^"]*"|`[^`]*`)|\b(import|from|export|const|let|return|if|else|for|of|await|async|function|new)\b|\b(\d[\d_]*)\b|[&<>]/g,
   (m,c,str,kw,num)=>c?`<span class="c">${esc(c)}</span>`:str?`<span class="s">${esc(str)}</span>`:kw?`<span class="k">${kw}</span>`:num?`<span class="n">${num}</span>`:esc(m));
}
const mark=(s,q)=>q?esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`):esc(s);
const jh=o=>esc(JSON.stringify(o,null,2)).replace(/"([^"]+)":/g,'<span class="jk">"$1"</span>:').replace(/: "([^"]*)"/g,': <span class="s">"$1"</span>').replace(/: (\d+)/g,': <span class="n">$1</span>');
const kv=r=>`<div class="kv">${r.map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`;
const pathHtml=p=>{const i=p.lastIndexOf('/');return `<span>${esc(p.slice(0,i+1))}<b>${esc(p.slice(i+1))}</b></span>`};
const GL={ok:['✓','ok2'],bad:['✗','bad'],run:['◔','todo'],todo:['○','todo'],skip:['–','skip'],done:['✓','ok2']};

function bodyHtml(e){
  const b=e.body||{k:'kv',rows:[]};
  let h=R[b.k](b), stat='';
  if(b.k==='diff'){const a=b.lines.filter(l=>l[0]==='p').length,d=b.lines.filter(l=>l[0]==='m').length;stat=`<span class="a">+${e.add??a}</span><span class="d">−${e.del??d}</span>`}
  const copy=`<button class="cp" data-c="${esc(b.path||e.t)}">${COPY}Copy</button>`;
  return `<div class="body"><div class="path"><span class="p"><em class="tool">${e.id}</em>${b.path?pathHtml(b.path):''}</span><span class="meta">${stat||(e.m?esc(e.m):'')}${copy}</span></div>${h}</div>`;
}
function rowEl(e){
  const d=D[e.id], el=document.createElement('div');
  el.className=`tc c-${d.c} ${e.s==='run'?'run-st':''} ${e.s==='fail'?'fail':''} ${e.s==='wait'?'wait':''}`;
  const chip=d.ext?`<span class="ext">${esc(extOf(e.t))}</span>`:'';
  const right=e.s==='run'?`<span class="meta" data-t>0.0s</span><span class="spin"></span>`
    :`${e.pill?`<span class="pill">${esc(e.pill)}</span>`:''}${e.add!=null?`<span class="meta"><span class="a">+${e.add}</span><span class="d">−${e.del}</span></span>`:`<span class="meta">${esc(e.m||'')}</span>`}${e.s?'':CHECK}`;
  el.innerHTML=`<button class="tc-h"><span class="ic">${ic(d.i)}</span><span class="verb">${d.v[e.s==='run'?1:0]}</span>${e.t?`<code class="tgt">${chip}<span>${esc(e.t)}</span></code>`:''}<span class="sp"></span>${right}${e.s==='run'?'':CHEV}</button><div class="tc-b"><div class="in">${e.s==='run'?'':bodyHtml(e)}</div></div>`;
  if(e.s!=='run'){
    el.classList.add('open');
    el.querySelector('.tc-h').onclick=()=>el.classList.toggle('open');
    if(e.body&&e.body.k==='sub'){const host=el.querySelector('.subhost');e.body.items.forEach(x=>host.appendChild(rowEl(x)))}
  }
  return el;
}
