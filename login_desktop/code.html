<body class="bg-surface-pure min-h-screen flex items-center justify-center font-body-md text-on-surface antialiased p-margin-sm md:p-margin-md">
<!-- Main Container -->
<main class="w-full max-w-[400px] flex flex-col gap-margin-md relative z-10">
<!-- Logo Header -->
<header class="flex flex-col items-center gap-unit text-center">
<img alt="Orplex Logo" class="h-24 w-auto mb-unit object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1WZQ2TTzw3vV5tvwCqhrI8DDxkZyLG0yoTkLUAnB13ElHkkrCdE9LyXJdirbHqBvbjJTWQPYTS_-eYVDjyQ122ub-4hYHYL8cPYGMY7J_gugXVe7LHVausl7JtdUX8eW7rceId4WqqFx2NjCtaXyIOJF_TRnlbsHomgMoSC_f7iww_ykWGj2fiDxZJhwJW1dJhnj4k3yYx8B_KJK9EP7JiogHL3pWnr4ezs97oo_LMUa053ZiOhO9mg5w"/>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Authenticate Sequence</h1>
<p class="text-secondary font-code-md text-code-md">Secure access to Orplex core.</p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-unit * 6 w-full" onsubmit="event.preventDefault();">
<!-- Inputs -->
<div class="flex flex-col gap-unit * 4">
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-widest" for="designation">Designation</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary text-[18px]">person</span>
<input class="w-full bg-surface-pure border border-border-light rounded focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-all pl-10 pr-4 py-3 font-code-md text-code-md text-on-surface placeholder:text-secondary/50 outline-none" id="designation" placeholder="name@domain.com" type="text"/>
</div>
</div>
<div class="flex flex-col gap-unit">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-widest" for="access_key">Access Key</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Access Key?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary text-[18px]">key</span>
<input class="w-full bg-surface-pure border border-border-light rounded focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-all pl-10 pr-4 py-3 font-code-md text-code-md text-on-surface placeholder:text-secondary/50 outline-none" id="access_key" placeholder="••••••••••••" type="password"/>
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary font-body-md text-body-md font-semibold py-3 rounded flex justify-center items-center gap-2 hover:bg-tertiary-container transition-colors shadow-sm mt-2 group relative overflow-hidden" type="submit">
<span class="relative z-10">Initialize Session</span>
<span class="material-symbols-outlined text-[18px] relative z-10 group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 w-full opacity-60">
<div class="h-px bg-border-light flex-1"></div>
<span class="font-label-caps text-label-caps text-secondary">OR</span>
<div class="h-px bg-border-light flex-1"></div>
</div>
<!-- Social Auth -->
<div class="flex flex-col gap-3">
<button class="w-full bg-surface-pure border border-border-light hover:border-primary-container hover:bg-accent-warm transition-all rounded py-3 flex justify-center items-center gap-3 text-on-surface font-code-md text-code-md group">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path></svg>
                Sign in with GitHub
            </button>
<button class="w-full bg-surface-pure border border-border-light hover:border-primary-container hover:bg-accent-warm transition-all rounded py-3 flex justify-center items-center gap-3 text-on-surface font-code-md text-code-md group">
<svg class="w-5 h-5" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                Sign in with Google
            </button>
</div>
<!-- Footer Link -->
<div class="text-center mt-2">
<span class="text-secondary font-code-md text-code-md">No existing designation?</span>
<a class="font-code-md text-code-md text-primary font-semibold hover:text-primary-container transition-colors ml-1" href="#">Request New Identity</a>
</div>

</body></html>
